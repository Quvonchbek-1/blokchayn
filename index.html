<script>
// ============== SOZLAMALAR ==============
const GAME_SECONDS = 180;
const ADMIN_PASSWORD = "admin2026"; 
const STORAGE_KEY = "crossword_scores_v1";

// TO'G'RI URL MANZIL:
const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbXNhi0utSygMHV51bLh75prrd9H8dH_WdniS0znzjxKOUwJsdljuQ-AGWtIUy9Iktizw/exec";

// ============== KROSSVORD MA'LUMOTLARI ==============
const placedWords = [
  { word: "TOKEN",     row: 0, col: 0, dir: "H", clue: "Blokcheynda qiymatga ega raqamli aktiv birligi" },
  { word: "ORACLE",    row: 0, col: 1, dir: "V", clue: "Tashqi (masalan, bank) ma'lumotini blokcheynga yetkazuvchi xizmat" },
  { word: "ZANJIR",    row: 2, col: 8, dir: "V", clue: "Bloklarning ketma-ket bog'langan tuzilmasi" },
  { word: "BLOKCHEYN", row: 4, col: 0, dir: "H", clue: "Ma'lumotlarni tarqoq va o'zgarmas holda saqlaydigan texnologiya" },
  { word: "KADASTR",   row: 4, col: 3, dir: "V", clue: "Yer uchastkalari va egalik huquqi hisobga olinadigan tizim" },
  { word: "ONEID",     row: 6, col: 5, dir: "H", clue: "Xaridor va sotuvchi tizimga shu orqali kiradigan identifikatsiya xizmati" },
  { word: "TARQOQ",    row: 9, col: 3, dir: "H", clue: "Markazlashmagan, ko'p nuqtada saqlanadigan tizim turi (sifatdosh)" }
];

const startCells = {};
let counter = 0;
[...placedWords].sort((a, b) => a.row - b.row || a.col - b.col).forEach(w => {
  const k = w.row + "," + w.col;
  if (!startCells[k]) startCells[k] = ++counter;
  w.num = startCells[k];
});

let gridData = {};
let curDir = "H";
let maxRow = 0, maxCol = 0;

placedWords.forEach(w => {
  for (let i = 0; i < w.word.length; i++) {
    const r = w.dir === "H" ? w.row : w.row + i;
    const c = w.dir === "H" ? w.col + i : w.col;
    maxRow = Math.max(maxRow, r);
    maxCol = Math.max(maxCol, c);
    const key = r + "," + c;
    if (!gridData[key]) gridData[key] = { letter: w.word[i], words: [] };
    else if (gridData[key].letter !== w.word[i]) console.error("Kesishma xatosi:", key, w.word);
    gridData[key].words.push({ id: w.num, dir: w.dir });
  }
});

const numRows = maxRow + 1, numCols = maxCol + 1;
const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${numCols}, 28px)`;
gridEl.style.gridTemplateRows = `repeat(${numRows}, 28px)`;
const cellRefs = {};

for (let r = 0; r < numRows; r++) {
  for (let c = 0; c < numCols; c++) {
    const key = r + "," + c;
    const cellDiv = document.createElement('div');
    cellDiv.className = 'cell';
    if (gridData[key]) {
      cellDiv.classList.add('active');
      cellDiv.dataset.key = key;
      if (startCells[key]) {
        const n = document.createElement('span');
        n.className = 'num'; n.textContent = startCells[key];
        cellDiv.appendChild(n);
      }
      const input = document.createElement('input');
      input.maxLength = 1; input.dataset.key = key; input.autocomplete = "off";
      input.addEventListener('input', e => onCellInput(e, key));
      input.addEventListener('keydown', e => onKeyDown(e, key));
      input.addEventListener('focus', () => {
        const ws = gridData[key].words;
        if (!ws.some(x => x.dir === curDir)) curDir = ws[0].dir;
        highlightWord(key);
      });
      cellDiv.appendChild(input);
      cellRefs[key] = input;
    }
    gridEl.appendChild(cellDiv);
  }
}

document.getElementById('solvedNum').textContent = `0/${placedWords.length}`;

const acrossWrap = document.getElementById('acrossClues');
const downWrap = document.getElementById('downClues');
[...placedWords].sort((a, b) => a.num - b.num).forEach(w => {
  const div = document.createElement('div');
  div.className = 'clue-item';
  div.dataset.wordId = w.num;
  div.dataset.dir = w.dir;
  div.innerHTML = `<span class="cnum">${w.num}.</span><span>${w.clue} <em>(${w.word.length} harf)</em></span>`;
  div.addEventListener('click', () => focusWord(w));
  (w.dir === "H" ? acrossWrap : downWrap).appendChild(div);
});

function focusWord(w) {
  if (gameOver) return;
  curDir = w.dir;
  const inp = cellRefs[w.row + "," + w.col];
  if (inp) { inp.focus(); highlightWord(w.row + "," + w.col); }
}

function highlightWord(key) {
  document.querySelectorAll('.cell.highlight').forEach(el => el.classList.remove('highlight'));
  document.querySelectorAll('.clue-item.active-clue').forEach(el => el.classList.remove('active-clue'));
  gridData[key].words.forEach(wref => {
    if (wref.dir !== curDir) return;
    const w = placedWords.find(pw => pw.num === wref.id && pw.dir === wref.dir);
    if (!w) return;
    for (let i = 0; i < w.word.length; i++) {
      const r = w.dir === "H" ? w.row : w.row + i;
      const c = w.dir === "H" ? w.col + i : w.col;
      const cd = document.querySelector(`.cell[data-key="${r},${c}"]`);
      if (cd) cd.classList.add('highlight');
    }
    const ci = document.querySelector(`.clue-item[data-word-id="${w.num}"][data-dir="${w.dir}"]`);
    if (ci) ci.classList.add('active-clue');
  });
}

function currentWord(key) {
  const ws = gridData[key].words;
  const pref = ws.find(w => w.dir === curDir) || ws[0];
  return placedWords.find(pw => pw.num === pref.id && pw.dir === pref.dir);
}

function stepFrom(key, delta) {
  const w = currentWord(key);
  const [r0, c0] = key.split(',').map(Number);
  const idx = w.dir === "H" ? c0 - w.col : r0 - w.row;
  const ni = idx + delta;
  if (ni < 0 || ni >= w.word.length) return;
  const nr = w.dir === "H" ? w.row : w.row + ni;
  const nc = w.dir === "H" ? w.col + ni : w.col;
  const next = cellRefs[nr + "," + nc];
  if (next) next.focus();
}

function onCellInput(e, key) {
  if (gameOver) { e.target.value = ""; return; }
  const val = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
  e.target.value = val.slice(-1);
  if (val) stepFrom(key, 1);
}

function onKeyDown(e, key) {
  if (e.key === "Backspace" && !e.target.value) stepFrom(key, -1);
  else if (e.key === " " || e.key === "Enter") {
    e.preventDefault();
    const other = curDir === "H" ? "V" : "H";
    if (gridData[key].words.some(x => x.dir === other)) { curDir = other; highlightWord(key); }
  }
}

let checkCount = 0, gameOver = false, timeLeft = GAME_SECONDS, timerInterval = null, playerName = "";

document.getElementById('checkBtn').addEventListener('click', () => {
  if (gameOver) return;
  checkCount++;
  document.getElementById('checkNum').textContent = checkCount;
  evaluateGrid();
});
document.getElementById('revealBtn').addEventListener('click', () => finishGame(false));

function lockBoard() {
  Object.values(cellRefs).forEach(i => i.disabled = true);
  document.getElementById('checkBtn').disabled = true;
  document.getElementById('revealBtn').disabled = true;
}

function revealAnswers() {
  Object.keys(gridData).forEach(key => {
    const input = cellRefs[key];
    if (input && input.value.toUpperCase() !== gridData[key].letter) {
      input.value = gridData[key].letter;
      document.querySelector(`.cell[data-key="${key}"]`).classList.add('revealed');
    }
  });
}

function evaluateGrid() {
  let solved = 0;
  placedWords.forEach(w => {
    let correct = true, filled = true;
    const cds = [];
    for (let i = 0; i < w.word.length; i++) {
      const r = w.dir === "H" ? w.row : w.row + i;
      const c = w.dir === "H" ? w.col + i : w.col;
      const input = cellRefs[r + "," + c];
      if (!input.value) filled = false;
      if (input.value.toUpperCase() !== w.word[i]) correct = false;
      cds.push(document.querySelector(`.cell[data-key="${r},${c}"]`));
    }
    cds.forEach(cd => {
      cd.classList.remove('filled-correct', 'filled-wrong');
      if (filled) cd.classList.add(correct ? 'filled-correct' : 'filled-wrong');
    });
    const item = document.querySelector(`.clue-item[data-word-id="${w.num}"][data-dir="${w.dir}"]`);
    if (correct && filled) { item.classList.add('solved'); solved++; }
    else item.classList.remove('solved');
  });
  document.getElementById('solvedNum').textContent = `${solved}/${placedWords.length}`;
  if (solved === placedWords.length && !gameOver) finishGame(true);
  return solved;
}

function formatTime(sec) {
  sec = Math.max(0, Number(sec) || 0);
  return `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, '0')}`;
}

function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const el = document.getElementById('timerNum');
    el.textContent = formatTime(timeLeft);
    if (timeLeft <= 30) el.classList.add('timer-warning');
    if (timeLeft <= 0) {
      document.getElementById('timeupbanner').classList.add('show');
      finishGame(false, true);
    }
  }, 1000);
}

function finishGame(completedEarly, timedOut) {
  if (gameOver) return;
  gameOver = true;
  clearInterval(timerInterval);
  const solved = evaluateGrid();
  revealAnswers();
  lockBoard();
  if (completedEarly) document.getElementById('winbanner').classList.add('show');
  saveScore({
    name: playerName || "Ismsiz",
    solved, total: placedWords.length,
    timeUsed: GAME_SECONDS - Math.max(timeLeft, 0),
    checks: checkCount,
    completed: !!completedEarly,
    timedOut: !!timedOut,
    date: new Date().toLocaleString('uz-UZ')
  });
}

document.getElementById('startBtn').addEventListener('click', () => {
  playerName = document.getElementById('playerNameInput').value.trim() || "Ismsiz";
  document.getElementById('startOverlay').classList.add('hidden');
  startTimer();
});
document.getElementById('playerNameInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('startBtn').click();
});

const sheetsOn = () => SHEET_WEBAPP_URL && !SHEET_WEBAPP_URL.includes("BU_YERGA");

function loadLocalScores() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { return []; }
}

function saveScore(record) {
  try {
    const scores = loadLocalScores();
    scores.push(record);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(scores));
  } catch (e) {}
  if (sheetsOn()) {
    fetch(SHEET_WEBAPP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(record)
    }).catch(err => console.warn("Sheets'ga yuborishda xatolik:", err));
  }
}

async function renderScoreTable() {
  const tbody = document.getElementById('scoreTableBody');
  document.querySelectorAll('.sheets-warn').forEach(n => n.remove());
  tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#9aa7b8;">Yuklanmoqda...</td></tr>`;

  let scores = [], usedSheets = false;
  if (sheetsOn()) {
    try {
      const res = await fetch(SHEET_WEBAPP_URL);
      scores = await res.json();
      usedSheets = Array.isArray(scores);
      if (!usedSheets) scores = loadLocalScores();
    } catch (err) {
      console.warn("Sheets'dan o'qishda xatolik:", err);
      scores = loadLocalScores();
    }
  } else scores = loadLocalScores();

  scores.sort((a, b) => (b.solved - a.solved) || (a.timeUsed - b.timeUsed));
  tbody.innerHTML = "";
  if (!scores.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:#9aa7b8;">Hali natija yo'q</td></tr>`;
  }
  scores.forEach((s, i) => {
    const tr = document.createElement('tr');
    const holat = s.completed ? "✅ Tugatdi" : (s.timedOut ? "⏰ Vaqt tugadi" : "⏹️ To'xtatdi");
    [i + 1, s.name, `${s.solved}/${s.total}`, formatTime(s.timeUsed), holat, s.date].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  if (!usedSheets) {
    const note = document.createElement('p');
    note.className = 'sheets-warn';
    note.style.cssText = "font-size:11px;color:var(--bad);margin-top:6px;";
    note.textContent = "⚠️ Google Sheets'ga ulanib bo'lmadi — faqat shu qurilmadagi natijalar ko'rsatilmoqda.";
    document.getElementById('scoreTable').after(note);
  }
}

document.getElementById('adminLink').addEventListener('click', () => {
  document.getElementById('adminPassOverlay').classList.remove('hidden');
  const p = document.getElementById('adminPassInput');
  p.value = ""; p.focus();
});
document.getElementById('adminCancelBtn').addEventListener('click', () => {
  document.getElementById('adminPassOverlay').classList.add('hidden');
});
document.getElementById('adminEnterBtn').addEventListener('click', () => {
  if (document.getElementById('adminPassInput').value === ADMIN_PASSWORD) {
    document.getElementById('adminPassOverlay').classList.add('hidden');
    renderScoreTable();
    document.getElementById('adminBoardOverlay').classList.remove('hidden');
  } else alert("Parol noto'g'ri!");
});
document.getElementById('adminPassInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('adminEnterBtn').click();
});
document.getElementById('closeAdminBtn').addEventListener('click', () => {
  document.getElementById('adminBoardOverlay').classList.add('hidden');
});
document.getElementById('clearScoresBtn').addEventListener('click', () => {
  if (confirm("Faqat shu qurilmadagi lokal nusxani o'chirishni tasdiqlaysizmi? (Google Sheets'dagi ma'lumot o'chmaydi)")) {
    localStorage.removeItem(STORAGE_KEY);
    renderScoreTable();
  }
});
</script>
